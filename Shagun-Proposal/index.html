<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Stars -->
<div class="stars"></div>

<!-- Moon -->
<div class="moon"></div>

<!-- Shooting Stars -->
<div class="shooting-stars"></div>

<!-- Background Music -->
<audio id="bgMusic" loop>
<source src="music/song.mpeg" type="audio/mpeg">
</audio>

<!-- INTRO -->

<section id="intro">

<h1>❤️ Happy Girlfriend's Day ❤️</h1>

<h2>For The Most Beautiful Girl In My Life ✨</h2>

<button id="startBtn">

Open My Surprise ❤️

</button>

</section>

<!-- COUNTDOWN -->

<section id="countdown" class="hidden">

<h1>Get Ready...</h1>

<div id="timer">5</div>

</section>

<!-- SLIDESHOW -->

<section id="gallery" class="hidden">

<h1>MOST BEAUTIFUL GIRL IN THE WORLD ❤️</h1>

<img id="slideshow" src="images/1.jpeg">

</section>

<!-- LETTER -->

<section id="letterPage" class="hidden">

<h1>💌 A Letter For You</h1>

<div class="glass">

<p id="typingText"></p>

</div>

<button id="nextBtn">

Continue ❤️

</button>

</section>

<!-- PROPOSAL -->

<section id="proposalPage" class="hidden">

<h1>

Will You Marry Me? 💍❤️

</h1>

<div class="buttons">

<button id="yesBtn">

YES ❤️

</button>

<button id="noBtn">

NO 💔

</button>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
